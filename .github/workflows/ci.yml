name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the held-out check reads the lock's history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check . && ruff format --check .
      - name: types
        run: mypy src tests
      - name: tests
        run: pytest -q
      - name: reports are generated, not edited
        if: matrix.python == '3.13'
        run: |
          python -m ocp.cli report
          git diff --exit-code -- REPORT.md README.md reports/pilots web/public/data/report.json
      - name: the committed development report passes its gates
        run: python -m ocp.cli gate dev
      - name: the held-out run happened once
        run: |
          if [ -f reports/heldout.lock ]; then
            n=$(git log --format=%H --no-renames -- reports/heldout.lock | wc -l)
            echo "heldout.lock commits: $n"; test "$n" -eq 1
            python -m ocp.cli heldout && exit 1 || test $? -eq 3
          fi
      - name: the development study reruns and still passes
        if: matrix.python == '3.13'
        run: |
          python -m ocp.cli dev
          python -m ocp.cli gate dev

  console:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t ocp .
      - name: the API takes a signed webhook and refuses a forged one
        run: |
          docker run -d -p 8080:8080 -e OCP_WEBHOOK_SECRET=ci-secret --name ocp ocp
          for i in $(seq 1 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
          body='{"event_id":"e1","type":"created","version":1,"alert":{"id":"al-1","category":"mixer"}}'
          ts=$(date +%s)
          mac=$(printf '%s' "$ts.$body" | openssl dgst -sha256 -hmac ci-secret -r | cut -d' ' -f1)
          curl -fs -X POST localhost:8080/v1/webhooks/alerts -H "X-Signature: t=$ts,v1=$mac" -H 'content-type: application/json' --data "$body"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/v1/webhooks/alerts -H "X-Signature: t=$ts,v1=deadbeef" -H 'content-type: application/json' --data "$body")
          test "$code" = "401"
          curl -fs localhost:8080/v1/cases | grep -q '"alert_id":"al-1"'
